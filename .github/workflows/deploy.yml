name: Deploy to App Platform

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly re-scan: new CVEs get published even when the code hasn't changed. Never deploys.
  schedule:
    - cron: "0 1 * * 1" # Mondays 01:00 UTC (09:00 Manila)

# Never run two production deploys at once; queue them instead of cancelling mid-deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Full audit report (all severities)
        run: |
          {
            echo "## Dependency audit"
            echo
            echo '```'
            pnpm audit || true
            echo '```'
          } > audit-report.md
          cat audit-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit-report.md

      - name: Gate - fail on CRITICAL vulnerabilities
        run: pnpm audit --audit-level critical

  codeql:
    name: Code scan (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  deploy:
    name: Deploy to DigitalOcean
    needs: [ci, dependency-scan, codeql]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Encode CA certificate onto one line
        env:
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
        run: |
          b64=$(printf '%s' "$DATABASE_CA_CERT" | base64 -w0)
          echo "::add-mask::$b64"
          echo "DATABASE_CA_CERT_B64=$b64" >> "$GITHUB_ENV"

      - name: Deploy app spec
        uses: digitalocean/app_action/deploy@v2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: .do/app.yaml
          print_build_logs: true
          print_deploy_logs: true
