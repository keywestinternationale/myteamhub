# DigitalOcean App Platform spec for myteamhub (web app + API in one app).
# Deployed by .github/workflows/deploy.yml (digitalocean/app_action/deploy@v2).
# ${VAR} placeholders are filled from the workflow's env (GitHub secrets) at deploy time.
name: myteamhub
region: sgp

# DNS lives on Cloudflare: each name is a CNAME -> <app>.ondigitalocean.app (DNS only); DO issues TLS.
# Every domain serves both components: /api/* -> api service, everything else -> web.
domains:
  - domain: myteamhub.ph
    type: PRIMARY
  - domain: www.myteamhub.ph
    type: ALIAS
  - domain: api.myteamhub.ph
    type: ALIAS

services:
  - name: api
    github:
      repo: keywestinternationale/myteamhub
      branch: main
      # GitHub Actions triggers deploys after CI passes, so App Platform's own auto-deploy is off.
      deploy_on_push: false
    environment_slug: node-js
    build_command: pnpm build
    run_command: pnpm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /api
        preserve_path_prefix: true
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 15
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_TIME
        value: https://myteamhub.ph,https://www.myteamhub.ph,https://api.myteamhub.ph
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: "${DATABASE_URL}"
      # Multi-line PEM is passed base64-encoded (one line) so it can't break this YAML; server/db.ts decodes it.
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        type: SECRET
        value: "${DATABASE_CA_CERT_B64}"
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: "${JWT_SECRET}"
      # Bearer key(s) for the Web Portal integration API (/api/integration/v1). Comma-separated for
      # rotation; each >= 32 chars. Unset/short => those routes answer 503 (never open).
      - key: INTEGRATION_API_KEYS
        scope: RUN_TIME
        type: SECRET
        value: "${INTEGRATION_API_KEYS}"

# Runs before each release goes live: applies new drizzle/*.sql migrations + drizzle/grants.sql
# (server/migrate.ts). If it fails, the deploy stops and the previous release keeps serving.
# Runs inside DO, so DB trusted sources can be restricted to this app (no CI runner IPs needed).
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: keywestinternationale/myteamhub
      branch: main
      deploy_on_push: false
    environment_slug: node-js
    build_command: pnpm build:migrate
    run_command: node dist/migrate.js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      # doadmin connection string; only this job gets it, never the api service.
      - key: DATABASE_ADMIN_URL
        scope: RUN_TIME
        type: SECRET
        value: "${DATABASE_ADMIN_URL}"
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        type: SECRET
        value: "${DATABASE_CA_CERT_B64}"

static_sites:
  - name: web
    github:
      repo: keywestinternationale/myteamhub
      branch: main
      deploy_on_push: false
    environment_slug: node-js
    # Expo Router static export of the same app the phones run. The API is same-origin (/api),
    # so no EXPO_PUBLIC_API_BASE_URL is needed.
    build_command: npx expo export --platform web --output-dir web-dist
    output_dir: web-dist
    # Unknown paths load the app; Expo Router then renders its own not-found screen.
    # (App Platform allows only one of catchall_document / error_document.)
    catchall_document: index.html
    routes:
      - path: /
    envs:
      - key: CI
        scope: BUILD_TIME
        value: "1"
